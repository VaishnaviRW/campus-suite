<main class="container py-4"><div class="d-flex justify-content-between align-items-center mb-4"><div><h1>Course Management</h1><p class="text-muted">Create and maintain academic courses.</p></div><a routerLink="/dashboard">Back to dashboard</a></div><p class="text-danger" *ngIf="error">{{error}}</p><div class="row"><div class="col-lg-4"><section class="card p-3"><h4>{{editingId?'Update':'Add'}} Course</h4><form (ngSubmit)="save()"><label class="mt-2">Course name</label><input class="form-control" name="name" [(ngModel)]="form.name" required><label class="mt-2">Course code</label><input class="form-control" name="code" [(ngModel)]="form.code" required><label class="mt-2">Duration</label><input class="form-control" name="duration" [(ngModel)]="form.duration" placeholder="e.g. 1 year"><label class="mt-2">Description</label><textarea class="form-control" name="description" [(ngModel)]="form.description"></textarea><button class="btn btn-primary mt-3" [disabled]="!form.name||!form.code">{{editingId?'Save changes':'Add course'}}</button><button type="button" class="btn btn-light mt-3 ml-2" (click)="reset()">Clear</button></form></section></div><div class="col-lg-8"><section class="card p-3"><h4>All Courses</h4><p *ngIf="loading">Loading...</p><div class="table-responsive"><table class="table table-hover"><thead><tr><th>Name</th><th>Code</th><th>Duration</th><th>Actions</th></tr></thead><tbody><tr *ngFor="let c of courses"><td>{{c.name}}</td><td>{{c.code}}</td><td>{{c.duration}}</td><td><button class="btn btn-sm btn-outline-primary" (click)="edit(c)">Edit</button> <button class="btn btn-sm btn-outline-danger" (click)="remove(c._id)">Delete</button></td></tr></tbody></table><p *ngIf="!loading&&!courses.length" class="text-muted">No courses created yet.</p></div></section></div></div></main>
